<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المجسم المعماري ثلاثي الأبعاد للمطعم - Maya Tech</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            overflow: hidden;
            background-color: #1a1a1a;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* واجهة التحكم العلوية والجانبية */
        .control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 100;
        }
        .control-panel h2 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #4CAF50;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
            text-align: center;
        }
        .control-group {
            margin-bottom: 15px;
        }
        .control-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #ccc;
        }
        .btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s;
            margin-top: 5px;
        }
        .btn:hover {
            background: #0b7dda;
            transform: translateY(-2px);
        }
        .btn-success {
            background: #4CAF50;
        }
        .btn-success:hover {
            background: #388E3C;
        }
        .btn-warning {
            background: #FF9800;
            color: #000;
        }
        .btn-warning:hover {
            background: #F57C00;
        }
        select, input[type="range"] {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
            margin-top: 5px;
        }
        /* مفتاح الدلالات والتوضيحات */
        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 12px;
            z-index: 100;
            max-width: 280px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }
        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            margin-left: 8px;
            display: inline-block;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #fff;
            background: rgba(0,0,0,0.8);
            padding: 20px 40px;
            border-radius: 10px;
            z-index: 1000;
            pointer-events: none;
            transition: opacity 0.5s;
        }
    </style>
    <!-- استدعاء مكتبة Three.js ومتحكم الكاميرا OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="loading">جاري بناء المجسم المعماري 3D... يرجى الانتظار</div>

    <div class="control-panel">
        <h2>لوحة التحكم الهندسية</h2>
        
        <div class="control-group">
            <label>وضع الكاميرا المشهدية:</label>
            <button class="btn btn-success" onclick="setView('overview')">منظور عام شامل (3D)</button>
            <button class="btn" onclick="setView('dining')">صالة الطعام والزبائن</button>
            <button class="btn" onclick="setView('kitchen')">مطبخ التحضير والشاورما</button>
            <button class="btn btn-warning" onclick="setView('bar')">بار المشروبات والحمامات</button>
        </div>

        <div class="control-group">
            <label>نظام الإضاءة والأجواء:</label>
            <select id="lightingSelect" onchange="changeLighting(this.value)">
                <option value="day">إضاءة نهارية ساطعة</option>
                <option value="night">إضاءة ليلية ديكورية</option>
            </select>
        </div>

        <div class="control-group">
            <label>ارتفاع الجدران الفاصلة:</label>
            <input type="range" id="wallHeightRange" min="0.5" max="4" step="0.1" value="2.5" oninput="updateWallHeight(this.value)">
        </div>
    </div>

    <div class="legend">
        <strong style="display:block; margin-bottom:8px; color:#4CAF50; border-bottom:1px solid #444; padding-bottom:4px;">دليل الأقسام الهندسية:</strong>
        <div class="legend-item"><span class="legend-color" style="background:#4CAF50;"></span>بار المشروبات والمغاسل (يمين سفلي)</div>
        <div class="legend-item"><span class="legend-color" style="background:#FFC107;"></span>صالة الطعام والطاولات</div>
        <div class="legend-item"><span class="legend-color" style="background:#E53935;"></span>محطات الشاورما والبروستد (أعلى يسار)</div>
        <div class="legend-item"><span class="legend-color" style="background:#2196F3;"></span>مطبخ التحضير والبرادات وقسم الجلي</div>
        <div class="legend-item"><span class="legend-color" style="background:#795548;"></span>المحلات التجارية الأربعة الواجهة</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls;
        let wallsGroup = new THREE.Group();
        let interiorGroup = new THREE.Group();
        let directionalLight, ambientLight;

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. إعداد المشهد والكاميرا
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x121212);
            scene.fog = new THREE.FogExp2(0x121212, 0.015);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 35, 45);

            // 2. إعداد الرندر (Renderer)
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 3. التحكم بالكاميرا
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // عدم النزول تحت الأرض
            controls.minDistance = 10;
            controls.maxDistance = 80;
            controls.target.set(0, 0, 0);

            // 4. الإضاءة
            ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            directionalLight = new THREE.DirectionalLight(0xfffaed, 0.9);
            directionalLight.position.set(20, 40, 20);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            // إضاءة خافتة مساعدة من الجهة الأخرى
            const fillLight = new THREE.DirectionalLight(0x90caf9, 0.3);
            fillLight.position.set(-20, 20, -20);
            scene.add(fillLight);

            // 5. بناء عناصر المطعم المعمارية
            buildFloorAndBase();
            buildRestaurantLayout();

            scene.add(wallsGroup);
            scene.add(interiorGroup);

            // إخفاء شاشة التحميل
            setTimeout(() => {
                const loader = document.getElementById('loading');
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 500);
            }, 800);

            window.addEventListener('resize', onWindowResize);
        }

        // بناء الأرضية والأبعاد الكلية للمطعم
        function buildFloorAndBase() {
            // أرضية المطعم الرئيسية
            const floorGeo = new THREE.PlaneGeometry(50, 50);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0xefefef, 
                roughness: 0.2,
                metalness: 0.1
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // شبكة إرشادية خفيفة على الأرضية
            const grid = new THREE.GridHelper(50, 50, 0x444444, 0xdddddd);
            grid.position.y = 0.01;
            scene.add(grid);
        }

        // بناء كافة تفاصيل المخطط بدقة مطابقة للصورة
        function buildRestaurantLayout() {
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.7 });
            const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xa5f3fc, transparent: true, opacity: 0.3, roughness: 0.1, transmission: 0.9 });
            const stainlessMat = new THREE.MeshStandardMaterial({ color: 0xc0c0c0, metalness: 0.9, roughness: 0.2 });
            const woodMat = new THREE.MeshStandardMaterial({ color: 0x8d5524, roughness: 0.5 });
            const darkWoodMat = new THREE.MeshStandardMaterial({ color: 0x3e2723, roughness: 0.6 });

            // دالة مساعدة لبناء الجدران
            function createWall(x, z, width, depth, height = 2.5) {
                const geometry = new THREE.BoxGeometry(width, height, depth);
                const wall = new THREE.Mesh(geometry, wallMat);
                wall.position.set(x, height / 2, z);
                wall.castShadow = true;
                wall.receiveShadow = true;
                wallsGroup.add(wall);
                return wall;
            }

            // --- 1. الجدران الخارجية للمطعم (مربع متكامل) ---
            createWall(0, -25, 50, 1); // جدار خلفي
            createWall(-25, 0, 1, 50); // جدار أيسر
            createWall(25, 0, 1, 50);  // جدار أيمن
            // الجدار الأمامي مقسم مع المحلات الأربعة
            createWall(-18, 25, 14, 1);
            createWall(10, 25, 30, 1);

            // --- 2. المحلات الأربعة الخارجية في الواجهة السفلية ---
            for (let i = 0; i < 4; i++) {
                let shopX = -18 + (i * 5.5);
                // واجهة المحل زجاجية
                const shopGlass = new THREE.Mesh(new THREE.BoxGeometry(4.5, 2.2, 0.2), glassMat);
                shopGlass.position.set(shopX, 1.1, 24.8);
                interiorGroup.add(shopGlass);

                // إطار المحل
                const shopFrame = new THREE.Mesh(new THREE.BoxGeometry(4.8, 2.3, 0.4), darkWoodMat);
                shopFrame.position.set(shopX, 1.15, 24.7);
                interiorGroup.add(shopFrame);
            }

            // --- 3. بار المشروبات والحمامات (المنطقة الدائرة الخضراء يمين سفلي) ---
            // بار المشروبات (كاونتر)
            const barCounter = new THREE.Mesh(new THREE.BoxGeometry(8, 1.1, 1.5), woodMat);
            barCounter.position.set(15, 0.55, 15);
            barCounter.castShadow = true;
            interiorGroup.add(barCounter);

            // كراسي البار المرتفعة
            for (let i = 0; i < 4; i++) {
                const stoolBase = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.8), stainlessMat);
                stoolBase.position.set(12 + (i * 2), 0.4, 13.8);
                interiorGroup.add(stoolBase);

                const stoolSeat = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.1), darkWoodMat);
                stoolSeat.position.set(12 + (i * 2), 0.85, 13.8);
                interiorGroup.add(stoolSeat);
            }

            // الحمامات والمغاسل خلف البار
            createWall(15, 19, 14, 0.5, 2.5); // جدار فاصل الحمامات
            // المغاسل
            for (let i = 0; i < 3; i++) {
                const basin = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.6), stainlessMat);
                basin.position.set(11 + (i * 1.5), 0.4, 21);
                interiorGroup.add(basin);
            }

            // الدرج العلوي بجانب البار (حسب المخطط)
            const stairGroup = new THREE.Group();
            for (let i = 0; i < 8; i++) {
                const step = new THREE.Mesh(new THREE.BoxGeometry(3, 0.2, 0.5), woodMat);
                step.position.set(15, i * 0.25, 20 + (i * 0.4));
                stairGroup.add(step);
            }
            interiorGroup.add(stairGroup);


            // --- 4. صالة الطعام الرئيسية (الجانب الأيمن) ---
            // طاولات دائرية ومستطيلة مع كراسيها
            for (let row = 0; row < 5; row++) {
                // طاولات يمين وسط
                createDiningTableAndChairs(8, -12 + (row * 6), true);
                // طاولات أقصى اليمين
                createDiningTableAndChairs(18, -12 + (row * 6), false);
            }

            function createDiningTableAndChairs(x, z, isCircle) {
                let table;
                if (isCircle) {
                    table = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 0.75, 32), woodMat);
                } else {
                    table = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.75, 1.2), woodMat);
                }
                table.position.set(x, 0.375, z);
                table.castShadow = true;
                interiorGroup.add(table);

                // أرجل الطاولة
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.75), stainlessMat);
                leg.position.set(x, 0.375, z);
                interiorGroup.add(leg);

                // كراسي حول الطاولة
                for (let c = 0; c < 4; c++) {
                    const angle = (c / 4) * Math.PI * 2;
                    const cx = x + Math.cos(angle) * 1.4;
                    const cz = z + Math.sin(angle) * 1.4;
                    const chair = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), darkWoodMat);
                    chair.position.set(cx, 0.25, cz);
                    chair.castShadow = true;
                    interiorGroup.add(chair);
                }
            }


            // --- 5. محطات الشاورما والبروستد (أعلى اليسار - المربعات الحمراء) ---
            createWall(-15, -20, 20, 0.5); // جدار قسم الشاورما العلوي
            
            // ماكينات الشاورما والفراغ المشوي (مربعات حمراء مميزة)
            const redMachineMat = new THREE.MeshStandardMaterial({ color: 0xd32f2f, roughness: 0.3 });
            for (let i = 0; i < 3; i++) {
                const machine = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.8, 1.2), redMachineMat);
                machine.position.set(-20 + (i * 3.5), 0.9, -21.5);
                machine.castShadow = true;
                interiorGroup.add(machine);

                // سيخ الشاورما العمودي
                const skewer = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.4), stainlessMat);
                skewer.position.set(-20 + (i * 3.5), 1.0, -21.5);
                interiorGroup.add(skewer);
            }

            // شفاطات الأستانلس فوق ماكينات الشاورما
            for (let i = 0; i < 3; i++) {
                const hood = new THREE.Mesh(new THREE.ConeGeometry(0.9, 0.8, 4), stainlessMat);
                hood.position.set(-20 + (i * 3.5), 2.2, -21.5);
                interiorGroup.add(hood);
            }


            // --- 6. مطبخ تحضير الطعام وغرفة التحضير (المساحة الزرقاء الوسطى) ---
            createWall(-12, -5, 0.5, 18); // جدار فاصل المطبخ الداخلي
            
            // طاولات تجهيز الأستانلس ستيل في المطبخ
            const prepTable1 = new THREE.Mesh(new THREE.BoxGeometry(4, 0.9, 1.5), stainlessMat);
            prepTable1.position.set(-15, 0.45, -12);
            prepTable1.castShadow = true;
            interiorGroup.add(prepTable1);

            const prepTable2 = new THREE.Mesh(new THREE.BoxGeometry(4, 0.9, 1.5), stainlessMat);
            prepTable2.position.set(-15, 0.45, -7);
            prepTable2.castShadow = true;
            interiorGroup.add(prepTable2);


            // --- 7. البرادات (مربعات أزرق وأحمر أسفل المطبخ) ---
            const blueFridgeMat = new THREE.MeshStandardMaterial({ color: 0x1976D2, metalness: 0.5, roughness: 0.2 });
            const redFridgeMat = new THREE.MeshStandardMaterial({ color: 0xC62828, metalness: 0.5, roughness: 0.2 });

            for (let i = 0; i < 4; i++) {
                let fMat = (i % 2 === 0) ? blueFridgeMat : redFridgeMat;
                const fridge = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.0, 1.2), fMat);
                fridge.position.set(-22 + (i * 1.5), 1.0, 2);
                fridge.castShadow = true;
                interiorGroup.add(fridge);
            }


            // --- 8. قسم الجلي (تحت العلامة X في المخطط) ---
            const sinkUnit = new THREE.Mesh(new THREE.BoxGeometry(3, 0.9, 1.2), stainlessMat);
            sinkUnit.position.set(-15, 0.45, 7);
            interiorGroup.add(sinkUnit);

            // حواض الجلي (حفر داخل الطاولة)
            for (let i = 0; i < 2; i++) {
                const basinHole = new THREE.Mesh(new THREE.BoxGeometry(1, 0.95, 0.8), darkWoodMat);
                basinHole.position.set(-15.8 + (i * 1.6), 0.48, 7);
                interiorGroup.add(basinHole);
            }
        }

        // --- وظائف التفاعل والتحكم ---
        function setView(viewType) {
            controls.autoRotate = false;
            switch(viewType) {
                case 'overview':
                    gsapAnimateCamera(0, 35, 45, 0, 0, 0);
                    break;
                case 'dining':
                    gsapAnimateCamera(13, 10, 0, 13, 0, 0);
                    break;
                case 'kitchen':
                    gsapAnimateCamera(-15, 12, -10, -15, 0, -10);
                    break;
                case 'bar':
                    gsapAnimateCamera(15, 12, 18, 15, 0, 15);
                    break;
            }
        }

        // دالة حركة سلسة لتنقل الكاميرا
        function gsapAnimateCamera(px, py, pz, tx, ty, tz) {
            const startPos = camera.position.clone();
            const targetPos = new THREE.Vector3(px, py, pz);
            const startTarget = controls.target.clone();
            const endTarget = new THREE.Vector3(tx, ty, tz);
            
            let progress = 0;
            function step() {
                progress += 0.03;
                if (progress > 1) progress = 1;
                
                camera.position.lerpVectors(startPos, targetPos, progress);
                controls.target.lerpVectors(startTarget, endTarget, progress);
                controls.update();
                
                if (progress < 1) {
                    requestAnimationFrame(step);
                }
            }
            step();
        }

        // تغيير الإضاءة (ليلي / نهاري)
        function changeLighting(type) {
            if (type === 'night') {
                scene.background = new THREE.Color(0x0b0f19);
                scene.fog.color.setHex(0x0b0f19);
                ambientLight.intensity = 0.3;
                directionalLight.intensity = 0.4;
                directionalLight.color.setHex(0xffaa55); // إضاءة دافئة ليلية
            } else {
                scene.background = new THREE.Color(0x121212);
                scene.fog.color.setHex(0x121212);
                ambientLight.intensity = 0.6;
                directionalLight.intensity = 0.9;
                directionalLight.color.setHex(0xfffaed);
            }
        }

        // التحكم بارتفاع الجدران
        function updateWallHeight(val) {
            const height = parseFloat(val);
            wallsGroup.clear();
            
            // إعادة بناء الجدران بالارتفاع الجديد
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.7 });
            function createWallH(x, z, width, depth) {
                const geometry = new THREE.BoxGeometry(width, height, depth);
                const wall = new THREE.Mesh(geometry, wallMat);
                wall.position.set(x, height / 2, z);
                wallsGroup.add(wall);
            }

            createWallH(0, -25, 50, 1);
            createWallH(-25, 0, 1, 50);
            createWallH(25, 0, 1, 50);
            createWallH(-18, 25, 14, 1);
            createWallH(10, 25, 30, 1);
            createWallH(15, 19, 14, 0.5);
            createWallH(-15, -20, 20, 0.5);
            createWallH(-12, -5, 0.5, 18);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
